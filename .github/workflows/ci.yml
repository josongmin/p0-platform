# PR 게이트 — typecheck·lint·테스트(통합 포함)·부팅 스모크·라쳇. 예산 5분.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: p0
          POSTGRES_PASSWORD: p0
          POSTGRES_DB: p0
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://p0:p0@localhost:5432/p0
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:4000
    steps:
      # NOTE: renovate의 helpers:pinGitHubActionDigests가 아래 태그를 SHA로 핀한다
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: lint (boundaries 불변량 포함)
        run: bun run lint

      - name: db push
        run: bun run db:push

      - name: tests + coverage (RBAC 통합 포함)
        working-directory: apps/accounts
        run: bun test --coverage --coverage-reporter=lcov

      - name: boot smoke (/health + JWKS)
        working-directory: apps/accounts
        run: |
          bun run src/index.ts &
          SERVER=$!
          sleep 2
          curl -fsS localhost:4000/health
          curl -fsS localhost:4000/api/auth/jwks > /dev/null
          kill $SERVER

      - name: ratchet (품질 후퇴 차단)
        env:
          RATCHET_REUSE_LCOV: '1'
        run: bun run ratchet
