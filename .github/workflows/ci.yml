# PR 게이트 — typecheck·lint·테스트(통합 포함)·부팅 스모크·라쳇. 예산 5분.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: p0
          POSTGRES_PASSWORD: p0
          POSTGRES_DB: p0
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://p0:p0@localhost:5432/p0
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:4000
    steps:
      # Actions는 SHA 핀 (태그 하이재킹 방지) — 버전 올릴 때 git ls-remote로 SHA 재조회
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: lint (boundaries 불변량 포함)
        run: bun run lint

      - name: db push
        run: bun run db:push

      - name: tests + coverage (RBAC 통합 포함)
        working-directory: apps/accounts
        run: bun test --coverage --coverage-reporter=lcov

      - name: boot smoke (/health + JWKS)
        working-directory: apps/accounts
        run: |
          bun run src/index.ts &
          SERVER=$!
          sleep 2
          curl -fsS localhost:4000/health
          curl -fsS localhost:4000/api/auth/jwks > /dev/null
          kill $SERVER

      - name: ratchet (품질 후퇴 차단)
        env:
          RATCHET_REUSE_LCOV: '1'
        run: bun run ratchet

      - name: mutation smoke (버그 심으면 테스트가 잡는가)
        run: bun ops-tools/mutation/cli.ts check

      # baseline.json을 직접 고쳐 기준을 낮추는 우회 차단.
      # 정당한 완화는 PR 제목에 [ratchet-loosen] + 본문 사유.
      - name: ratchet baseline 개악 방지
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[ratchet-loosen]') }}
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git show "origin/${{ github.base_ref }}:ops-tools/ratchet/baseline.json" > /tmp/base-baseline.json 2>/dev/null; then
            bun ops-tools/ratchet/cli.ts guard-baseline /tmp/base-baseline.json
          else
            echo "base 브랜치에 baseline 없음 — skip"
          fi
